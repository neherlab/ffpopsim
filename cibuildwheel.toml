[tool.cibuildwheel]

build-frontend = "build"

skip = [
  "*i686",
  "*musl*",
  "*ppc64le",
  "*s390x",
  "*win32",
  "pp*",
]

macos.archs = ["x86_64", "arm64"]

# GSL libraries from Homebrew require macOS 13.0 minimum
macos.environment = {MACOSX_DEPLOYMENT_TARGET = "13.0"}

build-verbosity = 1

linux.before-build = [
  "yum makecache fast",
  "yum install -y boost-devel gsl-devel >/dev/null",
]

macos.before-build = [
  "brew install boost gsl",
]


test-skip = [
  "*aarch64*",
  "*arm64*",
  "*ppc64*",
  "*s390x*",
]


linux.before-test = [
  "yum install -y parallel >/dev/null",
  "pip install 'biopython' 'matplotlib' 'numpy<2' 'pandas' 'pygments' 'scipy'"
]

linux.test-command = [
  "cd {project} && bash ./run-examples --skip-slow"
]


macos.before-test = [
  "brew install parallel >/dev/null",
  "pip install 'biopython' 'matplotlib' 'numpy<2' 'pandas' 'pygments' 'scipy'"
]

# Run same tests as Linux for consistency
macos.test-command = [
  "cd {project} && bash ./run-examples --skip-slow"
]
